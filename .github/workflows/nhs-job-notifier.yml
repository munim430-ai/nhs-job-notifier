name: NHS Job Notifier

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:   # lets you trigger a manual run from GitHub UI anytime

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit jobs.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run NHS Job Notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          FILTER_KEYWORDS:    ${{ secrets.FILTER_KEYWORDS }}
          FILTER_LOCATIONS:   ${{ secrets.FILTER_LOCATIONS }}
          MIN_PAY_BAND:       ${{ secrets.MIN_PAY_BAND }}
          LOOKBACK_DAYS:      "1"
        run: node src/index.js

      - name: Save deduplication database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "chore: update seen jobs [skip ci]"
          git push
